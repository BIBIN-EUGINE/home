<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Storage & Retrieval App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .data-app-container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .app-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h2 {
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-right: 10px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button.delete-btn {
            background: #e74c3c;
            padding: 8px 16px;
            font-size: 12px;
        }
        
        button.delete-btn:hover {
            background: #c0392b;
        }
        
        button.clear-btn {
            background: #95a5a6;
        }
        
        button.clear-btn:hover {
            background: #7f8c8d;
        }
        
        button.export-btn {
            background: #27ae60;
        }
        
        button.export-btn:hover {
            background: #229954;
        }
        
        .data-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            transition: transform 0.2s;
        }
        
        .data-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .data-item-key {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        
        .data-item-value {
            color: #333;
            word-wrap: break-word;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .data-item-meta {
            font-size: 12px;
            color: #6c757d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .empty-state {
            text-align: center;
            color: #6c757d;
            padding: 40px;
            font-size: 1.1em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }
        
        .search-box {
            margin-bottom: 20px;
        }
        
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8em;
            }
            
            .app-section {
                padding: 15px;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="data-app-container">
        <header>
            <h1>📦 Data Storage App</h1>
            <p>Store and retrieve data easily with your browser's local storage</p>
        </header>

        <div class="app-section">
            <h2>📝 Store Data</h2>
            <div id="message-container"></div>
            <form id="dataForm">
                <div class="form-group">
                    <label for="dataKey">Key (Unique Identifier):</label>
                    <input type="text" id="dataKey" name="dataKey" placeholder="e.g., myNote, user123, config" required>
                </div>
                <div class="form-group">
                    <label for="dataValue">Value (Data to Store):</label>
                    <textarea id="dataValue" name="dataValue" placeholder="Enter your data here..." required></textarea>
                </div>
                <div class="button-group">
                    <button type="submit">💾 Save Data</button>
                    <button type="button" class="clear-btn" onclick="clearForm()">🔄 Clear Form</button>
                    <button type="button" class="export-btn" onclick="exportData()">📥 Export All Data</button>
                </div>
            </form>
        </div>

        <div class="app-section">
            <h2>📊 Statistics</h2>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalItems">0</div>
                    <div class="stat-label">Total Items</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="storageUsed">0 KB</div>
                    <div class="stat-label">Storage Used</div>
                </div>
            </div>
        </div>

        <div class="app-section">
            <h2>🔍 Retrieve Data</h2>
            <div class="search-box">
                <input type="text" id="searchKey" placeholder="🔎 Search by key..." onkeyup="filterData()">
            </div>
            <div id="dataList"></div>
        </div>
    </div>

    <script>
        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            loadAllData();
            updateStats();
        });

        // Store data
        document.getElementById('dataForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const key = document.getElementById('dataKey').value.trim();
            const value = document.getElementById('dataValue').value.trim();
            
            if (!key || !value) {
                showMessage('Please fill in both key and value fields', 'error');
                return;
            }
            
            try {
                const dataItem = {
                    key: key,
                    value: value,
                    timestamp: new Date().toISOString(),
                    lastModified: new Date().toISOString()
                };
                
                // Check if key already exists
                const existingData = localStorage.getItem('dataApp_' + key);
                const action = existingData ? 'updated' : 'saved';
                
                localStorage.setItem('dataApp_' + key, JSON.stringify(dataItem));
                
                showMessage(`✅ Data ${action} successfully with key: ${key}`, 'success');
                clearForm();
                loadAllData();
                updateStats();
            } catch (error) {
                if (error.name === 'QuotaExceededError') {
                    showMessage('❌ Storage quota exceeded! Please delete some items.', 'error');
                } else {
                    showMessage('❌ Error saving data: ' + error.message, 'error');
                }
            }
        });

        // Load and display all data
        function loadAllData() {
            const dataList = document.getElementById('dataList');
            const searchTerm = document.getElementById('searchKey').value.toLowerCase();
            
            const allData = [];
            
            // Get all items from localStorage that start with our prefix
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('dataApp_')) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        allData.push(data);
                    } catch (error) {
                        console.error('Error parsing data for key:', key);
                    }
                }
            }
            
            // Filter data based on search term
            const filteredData = allData.filter(item => 
                item.key.toLowerCase().includes(searchTerm) ||
                item.value.toLowerCase().includes(searchTerm)
            );
            
            // Sort by timestamp (newest first)
            filteredData.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            if (filteredData.length === 0) {
                dataList.innerHTML = '<div class="empty-state">📭 No data stored yet. Start by adding some data above!</div>';
                return;
            }
            
            let html = '';
            filteredData.forEach(item => {
                const date = new Date(item.timestamp).toLocaleString();
                const escapedKey = escapeHtml(item.key);
                html += `
                    <div class="data-item">
                        <div class="data-item-key">${escapedKey}</div>
                        <div class="data-item-value">${escapeHtml(item.value)}</div>
                        <div class="data-item-meta">
                            <span>🕒 ${date}</span>
                            <button class="delete-btn" data-key="${escapedKey}">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            });
            
            dataList.innerHTML = html;
        }

        // Delete specific data item using event delegation
        document.getElementById('dataList').addEventListener('click', function(e) {
            if (e.target.classList.contains('delete-btn')) {
                const key = e.target.getAttribute('data-key');
                if (confirm(`Are you sure you want to delete the item with key: ${key}?`)) {
                    localStorage.removeItem('dataApp_' + key);
                    showMessage(`✅ Data with key "${key}" deleted successfully`, 'success');
                    loadAllData();
                    updateStats();
                }
            }
        });

        // Filter data based on search
        function filterData() {
            loadAllData();
        }

        // Clear the form
        function clearForm() {
            document.getElementById('dataKey').value = '';
            document.getElementById('dataValue').value = '';
        }

        // Update statistics
        function updateStats() {
            let count = 0;
            let totalSize = 0;
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('dataApp_')) {
                    count++;
                    const value = localStorage.getItem(key);
                    totalSize += key.length + value.length;
                }
            }
            
            document.getElementById('totalItems').textContent = count;
            document.getElementById('storageUsed').textContent = (totalSize / 1024).toFixed(2) + ' KB';
        }

        // Show message to user
        function showMessage(message, type) {
            const container = document.getElementById('message-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            
            container.innerHTML = '';
            container.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Export data
        function exportData() {
            const allData = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('dataApp_')) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        allData.push(data);
                    } catch (error) {
                        console.error('Error exporting data:', error);
                    }
                }
            }
            
            if (allData.length === 0) {
                showMessage('⚠️ No data to export', 'error');
                return;
            }
            
            const dataStr = JSON.stringify(allData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'data-export-' + new Date().toISOString().split('T')[0] + '.json';
            link.click();
            
            showMessage('✅ Data exported successfully!', 'success');
        }
    </script>
</body>
</html>
